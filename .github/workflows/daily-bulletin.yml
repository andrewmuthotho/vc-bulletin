# The alarm clock: tells GitHub to run make_bulletin.py every morning.
name: Daily VC Bulletin

on:
  schedule:
    - cron: "47 2 * * *" # 05:47 Nairobi time 
    - cron: "47 3 * * *" # 06:47 Nairobi time (backup)
    - cron: "53 4 * * *" # 07:53 Nairobi time (backup)
  workflow_dispatch:         # adds a "Run workflow" button so you can trigger it by hand

permissions:
  contents: write            # lets the job save the new bulletin back into the repository

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make today's bulletin
        run: python make_bulletin.py

      - name: Save it (publishes to GitHub Pages)
        run: |
          git config user.name "vc-bulletin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git commit -m "Bulletin for $(date -u +%Y-%m-%d)" || echo "Nothing changed"
          git push
